<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeWork B1 – Nguyễn Thiện Nhân</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            padding: 24px 16px 60px;
            color: #1e293b;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        header h1 {
            font-size: 2.1rem;
            color: #6d28d9;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        header p {
            color: #64748b;
            margin-top: 6px;
            font-size: 1.05rem;
        }

        /* Câu hỏi trắc nghiệm */
        .quiz {
            max-width: 800px;
            margin: 0 auto 30px;
            background: #fff;
            border: 1px solid #e9d5ff;
            border-radius: 16px;
            padding: 22px 28px;
            box-shadow: 0 4px 20px rgba(109, 40, 217, 0.06);
        }
        .quiz h2 {
            font-size: 0.85rem;
            color: #6d28d9;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .quiz p {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1e293b;
        }
        .quiz code {
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
            border-radius: 6px;
            padding: 2px 8px;
            font-family: Consolas, monospace;
            color: #7c3aed;
            font-size: 0.95em;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            margin-bottom: 10px;
            font-size: 0.92rem;
            transition: all 0.2s;
        }
        .option.correct {
            border-color: #22c55e;
            background: #f0fdf4;
            color: #15803d;
            font-weight: 600;
        }
        .option.wrong {
            border-color: #f1f5f9;
            background: #f8fafc;
            color: #94a3b8;
            text-decoration: line-through;
        }
        .opt-key {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.82rem;
            flex-shrink: 0;
        }

        /* Container & Thanh điều khiển */
        .container {
            width: 100%;
            max-width: 98vw;
            margin: 0 auto;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .section-header h2 {
            font-size: 1.25rem;
            color: #1e293b;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .view-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            padding: 4px 8px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .view-controls span {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 600;
            margin-right: 4px;
        }
        .view-btn {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #475569;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .view-btn:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .view-btn.active {
            background: #7c3aed;
            color: #ffffff;
            border-color: #6d28d9;
        }

        /* Bố cục Grid 5 Card / Dòng (Mặc định) */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 16px;
        }
        .grid.cols-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .grid.cols-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        @media (max-width: 1400px) {
            .grid:not(.cols-2):not(.cols-3) {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        @media (max-width: 900px) {
            .grid, .grid.cols-3, .grid.cols-2 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        @media (max-width: 620px) {
            .grid, .grid.cols-3, .grid.cols-2 {
                grid-template-columns: 1fr;
            }
        }

        /* Card bài tập */
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 14px rgba(109, 40, 217, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            box-shadow: 0 8px 24px rgba(109, 40, 217, 0.12);
        }

        /* Header của từng Card */
        .card-header {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
        }
        .card-header .num {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
            font-size: 0.74rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .card-header h3 {
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
            flex: 1;
        }

        /* Body của Card */
        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            background: #ffffff;
        }

        /* Tiêu đề mục nhỏ (Mã nguồn / Output) */
        .block-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.74rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-group {
            display: flex;
            gap: 5px;
        }
        .action-btn {
            background: #f5f3ff;
            color: #6d28d9;
            border: 1px solid #ddd6fe;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .action-btn:hover {
            background: #ede9fe;
            color: #5b21b6;
        }

        /* Khung hiển thị Source Code to hơn, thấy hết code */
        .code-container {
            background: #0f172a;
            border-radius: 8px;
            padding: 12px 14px 8px 14px;
            height: 290px;
            overflow: auto;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #64748b #1e293b;
        }
        .code-container pre {
            margin: 0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.82rem;
            line-height: 1.58;
            color: #e2e8f0;
            white-space: pre;
            padding-bottom: 6px;
        }

        /* Thanh trượt ngang/dọc to, rõ nét, dễ thao tác */
        .code-container::-webkit-scrollbar {
            width: 9px;
            height: 11px; /* Thanh trượt ngang cao 11px rõ ràng */
        }
        .code-container::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 6px;
            margin: 2px 4px;
        }
        .code-container::-webkit-scrollbar-thumb {
            background: #64748b;
            border-radius: 6px;
            border: 2px solid #1e293b;
        }
        .code-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
            cursor: grab;
        }
        .code-container::-webkit-scrollbar-thumb:active {
            background: #cbd5e1;
            cursor: grabbing;
        }

        /* Tô màu cú pháp (Syntax Highlight) chuẩn xác */
        .kw      { color: #c084fc; font-weight: 600; }  /* let, const, var, try, catch */
        .fn      { color: #60a5fa; font-weight: 600; }  /* console.log */
        .str     { color: #34d399; }                   /* chuỗi string */
        .num-val { color: #fbbf24; }                   /* số number */
        .com     { color: #94a3b8; font-style: italic; } /* chú thích comment */

        /* Khung hiển thị Output Console in đậm nổi bật */
        .output-container {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-left: 4px solid #10b981;
            border-radius: 8px;
            padding: 10px 12px;
            height: 120px;
            overflow: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            line-height: 1.65;
            color: #0f172a;
            font-weight: 700;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }
        .output-container::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        .output-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .output-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .output-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .output-container .line {
            word-break: break-word;
            font-weight: 700;
            color: #0f172a;
        }
        .output-container .line::before {
            content: "❯ ";
            color: #10b981;
            font-weight: 800;
        }
        .output-container:empty::before {
            content: "Đang tải kết quả...";
            color: #94a3b8;
            font-style: italic;
            font-weight: 400;
        }

        /* Modal Phóng To Xem Chi Tiết */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            animation: modalFadeIn 0.2s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to   { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
        }
        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .modal-close:hover {
            background: rgba(255,255,255,0.35);
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-code-container {
            background: #0f172a;
            border-radius: 10px;
            padding: 16px;
            max-height: 380px;
            overflow: auto;
        }
        .modal-code-container pre {
            font-family: 'Consolas', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e2e8f0;
        }
        .modal-output-container {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-left: 5px solid #10b981;
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Consolas', monospace;
            font-size: 0.95rem;
            line-height: 1.65;
            color: #0f172a;
            font-weight: 700;
        }
        .modal-output-container .line {
            font-weight: 700;
            color: #0f172a;
        }
        .modal-output-container .line::before {
            content: "❯ ";
            color: #10b981;
            font-weight: 800;
        }
    </style>
</head>
<body>

<header>
    <h1>📚 HomeWork – Bài tập B1</h1>
    <p>Sinh viên: <strong style="color:#6d28d9">Nguyễn Thiện Nhân</strong> | Web1044</p>
</header>

<!-- Câu hỏi trắc nghiệm -->
<div class="quiz">
    <h2>Câu hỏi trắc nghiệm</h2>
    <p>Kết quả của <code>console.log("10" + 5);</code> là gì?</p>
    <div class="option wrong"><span class="opt-key">A</span> NaN (Not a Number)</div>
    <div class="option wrong"><span class="opt-key">B</span> 15</div>
    <div class="option wrong"><span class="opt-key">C</span> TypeError</div>
    <div class="option correct"><span class="opt-key">D</span> 105</div>
</div>

<!-- Khu vực hiển thị 10 bài tập chia 5 card/dòng -->
<div class="container">
    <div class="section-header">
        <h2>📋 Danh sách bài tập thực hành</h2>
        <div class="view-controls">
            <span>Chế độ xem:</span>
            <button class="view-btn active" onclick="setColumns(5, this)">5 Cột (Mặc định)</button>
            <button class="view-btn" onclick="setColumns(3, this)">3 Cột (Rộng hơn)</button>
            <button class="view-btn" onclick="setColumns(2, this)">2 Cột (Cực đại)</button>
        </div>
    </div>
    <div class="grid" id="output-area"></div>
</div>

<!-- Modal Phóng to chi tiết bài tập -->
<div class="modal-overlay" id="detail-modal" onclick="closeModal(event)">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modal-title">Chi tiết bài tập</h3>
            <button class="modal-close" onclick="closeModalDirect()">✕</button>
        </div>
        <div class="modal-body">
            <div class="block-title">
                <span>💻 Mã nguồn</span>
                <button class="action-btn" id="modal-copy-btn">Sao chép</button>
            </div>
            <div class="modal-code-container">
                <pre><code id="modal-code"></code></pre>
            </div>

            <div class="block-title">
                <span>🖥️ Kết quả Output</span>
            </div>
            <div class="modal-output-container" id="modal-output"></div>
        </div>
    </div>
</div>

<script>
    // Dữ liệu tiêu đề và mã nguồn 10 bài tập
    const exercises = [
        {
            id: 1,
            title: "In thông tin cá nhân",
            code: `console.log("Họ tên:Nguyễn Thiện Nhân");
console.log("Tuổi: 17");
console.log("Địa chỉ: Tổ 10b, ấp an thạnh, xã an ngãi, huyện Long Điền, Tỉnh Bà Rịa-Vũng Tàu");
console.log("Nghề nghiệp: Đang là sinh viên chưa có việc làm:))");`
        },
        {
            id: 2,
            title: "Khai báo và sử dụng biến",
            code: `let fullName = "Nguyễn Thiện Nhân";
let age = 17;
let diemTrungBinh = 9.0;

console.log(fullName);
console.log(age);
console.log(diemTrungBinh);`
        },
        {
            id: 3,
            title: "Tính tổng hai số",
            code: `let a = 15;
let b = 8;

console.log("Tổng:", a + b);
console.log("Hiệu:", a - b);
console.log("Tích:", a * b);
console.log("Thương:", a / b);`
        },
        {
            id: 4,
            title: "Tính diện tích hình chữ nhật",
            code: `let chieuDai = 20;
let chieuRong = 8;

let dienTich = chieuDai * chieuRong;
let chuVi = 2 * (chieuDai + chieuRong);

console.log("Diện tích:", dienTich);
console.log("Chu vi:", chuVi);`
        },
        {
            id: 5,
            title: "Phân biệt let và const",
            code: `let age5 = 20;
console.log("Age ban đầu:", age5);

age5 = 21;
console.log("Age sau khi thay đổi:", age5);

const PI = 3.14;
console.log("PI:", PI);

// Thử thay đổi PI -> sẽ bị lỗi vì PI là const
try {
    PI = 3.14159;
} catch (e) {
    console.log("Lỗi:", e.message);
}
// Giá trị của const sẽ không bao giờ thay đổi được sau khi đã gán.`
        },
        {
            id: 6,
            title: "Kiểm tra kiểu dữ liệu",
            code: `let a6 = 100;
let b6 = "100";
let c6 = true;
let d6;
let e6 = null;

console.log(typeof a6); // "number"
console.log(typeof b6); // "string"
console.log(typeof c6); // "boolean"
console.log(typeof d6); // "undefined"
console.log(typeof e6); // "object"  (đây là quirk nổi tiếng của JS)
// Quirk = "điểm kỳ lạ / hành vi bất thường" của JavaScript.`
        },
        {
            id: 7,
            title: "Template String",
            code: `let hoTen = "Nguyen Van An";
let tuoi = 20;

console.log(\`Xin chào, tôi là \${hoTen}, năm nay tôi \${tuoi} tuổi.\`);

// Làm quen cách in ra dạng chuỗi`
        },
        {
            id: 8,
            title: "Tính điểm trung bình",
            code: `let toan = 8;
let ly = 7;
let hoa = 9;

let diemTB = (toan + ly + hoa) / 3;
console.log("Điểm trung bình:", diemTB);`
        },
        {
            id: 9,
            title: "Tạo đối tượng sinh viên",
            code: `let sinhVien = {
    maSV: "SV001",
    hoTen: "Nguyen Van An",
    tuoi: 20,
    gioiTinh: "Nam",
    diemTB: 8.5
};

console.log("Mã SV:", sinhVien.maSV);
console.log("Họ tên:", sinhVien.hoTen);
console.log("Tuổi:", sinhVien.tuoi);
console.log("Giới tính:", sinhVien.gioiTinh);
console.log("Điểm TB:", sinhVien.diemTB);`
        },
        {
            id: 10,
            title: "Thông tin sản phẩm",
            code: `let maSP = "SP001";
let tenSP = "Laptop Dell";
let donGia = 15000000;
let soLuong = 3;

let thanhTien = donGia * soLuong;

console.log(\`Mã SP: \${maSP}\`);
console.log(\`Tên SP: \${tenSP}\`);
console.log(\`Đơn giá: \${donGia}\`);
console.log(\`Số lượng: \${soLuong}\`);
console.log(\`Thành tiền: \${thanhTien}\`);

console.log(typeof maSP);     // "string"
console.log(typeof tenSP);    // "string"
console.log(typeof donGia);   // "number"
console.log(typeof soLuong);  // "number"
console.log(typeof thanhTien);// "number"`
        }
    ];

    // Escape HTML an toàn
    function escapeHtml(str) {
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    // Tô màu cú pháp bằng Tokenizer đơn lẻ (tránh lỗi xung đột chuỗi/comment)
    function highlightJS(code) {
        const tokenRegex = /(\/\/[^\n]*)|(`(?:\\.|[^`])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(console\.log|console)\b|\b(let|const|var|typeof|try|catch|function|return|if|else)\b|\b(\d+(?:\.\d+)?)\b/g;

        let lastIndex = 0;
        let result = "";
        let match;

        while ((match = tokenRegex.exec(code)) !== null) {
            result += escapeHtml(code.slice(lastIndex, match.index));
            lastIndex = tokenRegex.lastIndex;

            if (match[1]) {
                result += `<span class="com">${escapeHtml(match[1])}</span>`;
            } else if (match[2]) {
                result += `<span class="str">${escapeHtml(match[2])}</span>`;
            } else if (match[3]) {
                result += `<span class="fn">${escapeHtml(match[3])}</span>`;
            } else if (match[4]) {
                result += `<span class="kw">${escapeHtml(match[4])}</span>`;
            } else if (match[5]) {
                result += `<span class="num-val">${escapeHtml(match[5])}</span>`;
            }
        }
        result += escapeHtml(code.slice(lastIndex));
        return result;
    }

    // Sao chép mã nguồn
    function copyCode(baiId, btn) {
        const item = exercises.find(e => e.id === baiId);
        if (!item) return;
        navigator.clipboard.writeText(item.code).then(() => {
            const originalText = btn.textContent;
            btn.textContent = "✓ Đã chép!";
            btn.style.background = "#dcfce7";
            btn.style.color = "#15803d";
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = "";
                btn.style.color = "";
            }, 1400);
        });
    }

    // Chuyển đổi số cột xem (5 cột, 3 cột, 2 cột)
    function setColumns(cols, btn) {
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const grid = document.getElementById("output-area");
        grid.className = "grid";
        if (cols === 3) grid.classList.add("cols-3");
        if (cols === 2) grid.classList.add("cols-2");
    }

    // Phóng to Modal
    function openModal(baiId) {
        const item = exercises.find(e => e.id === baiId);
        if (!item) return;

        document.getElementById("modal-title").textContent = `Bài ${item.id} – ${item.title}`;
        document.getElementById("modal-code").innerHTML = highlightJS(item.code);

        const outBox = document.getElementById("out-" + item.id);
        document.getElementById("modal-output").innerHTML = outBox ? outBox.innerHTML : "";

        const copyBtn = document.getElementById("modal-copy-btn");
        copyBtn.onclick = function() {
            navigator.clipboard.writeText(item.code).then(() => {
                copyBtn.textContent = "✓ Đã chép!";
                setTimeout(() => { copyBtn.textContent = "Sao chép"; }, 1400);
            });
        };

        document.getElementById("detail-modal").classList.add("active");
    }

    function closeModal(e) {
        if (e.target.id === "detail-modal") {
            document.getElementById("detail-modal").classList.remove("active");
        }
    }
    function closeModalDirect() {
        document.getElementById("detail-modal").classList.remove("active");
    }

    // Render 10 Cards vào giao diện Grid
    const grid = document.getElementById("output-area");
    exercises.forEach(ex => {
        grid.innerHTML += `
            <div class="card">
                <div class="card-header">
                    <span class="num">Bài ${ex.id}</span>
                    <h3 title="${ex.title}">${ex.title}</h3>
                </div>
                <div class="card-body">
                    <div class="block-title">
                        <span>💻 Mã nguồn</span>
                        <div class="btn-group">
                            <button class="action-btn" onclick="openModal(${ex.id})" title="Phóng to để xem toàn bộ">🔍 Phóng to</button>
                            <button class="action-btn" onclick="copyCode(${ex.id}, this)">Sao chép</button>
                        </div>
                    </div>
                    <div class="code-container">
                        <pre><code>${highlightJS(ex.code)}</code></pre>
                    </div>

                    <div class="block-title">
                        <span>🖥️ Kết quả Output</span>
                    </div>
                    <div class="output-container" id="out-${ex.id}"></div>
                </div>
            </div>`;
    });

    // Can thiệp console.log để xuất ra khung tương ứng
    let currentBai = 0;
    const _log = console.log;
    console.log = function (...args) {
        _log.apply(console, args);
        const text = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(" ");
        const box = document.getElementById("out-" + currentBai);
        if (box) {
            const line = document.createElement("div");
            line.className = "line";
            line.textContent = text;
            box.appendChild(line);
        }
    };
</script>
